<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Dayform responsive review</title
  ><style>
    body {
      margin: 0;
      background: #deded7;
      font: 13px Arial;
    }
    header {
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 9px;
    }
    iframe {
      display: block;
      margin: 0 auto;
      width: 390px;
      height: 844px;
      border: 0;
      background: #faf9f5;
    }
    output {
      font-size: 11px;
    }
  </style>
  <header>
    <button data-width="320">320</button><button data-width="390">390</button
    ><button data-width="768">768</button
    ><button data-target="workflow">Workflow</button
    ><button data-target="details">Feature grid</button
    ><button id="top">Top</button><output></output>
  </header>
  <iframe title="Dayform mobile preview" src="./index.html"></iframe>
  <script>
    const frame = document.querySelector("iframe");
    let observer;
    function measure() {
      const doc = frame.contentDocument;
      if (!doc?.body) return;
      document.querySelector("output").textContent =
        `Document ${doc.documentElement.scrollWidth}px / viewport ${frame.contentWindow.innerWidth}px · ${doc.documentElement.scrollWidth > frame.contentWindow.innerWidth ? "OVERFLOW" : "no horizontal overflow"}`;
    }
    frame.addEventListener("load", () => {
      observer?.disconnect();
      observer = new ResizeObserver(measure);
      observer.observe(frame.contentDocument.body);
      measure();
    });
    document.querySelectorAll("[data-width]").forEach((b) =>
      b.addEventListener("click", () => {
        frame.style.width = b.dataset.width + "px";
        requestAnimationFrame(measure);
      }),
    );
    document
      .querySelectorAll("[data-target]")
      .forEach((b) =>
        b.addEventListener("click", () =>
          frame.contentDocument
            .getElementById(b.dataset.target)
            .scrollIntoView(),
        ),
      );
    document
      .querySelector("#top")
      .addEventListener("click", () => frame.contentWindow.scrollTo(0, 0));
  </script>
</html>
