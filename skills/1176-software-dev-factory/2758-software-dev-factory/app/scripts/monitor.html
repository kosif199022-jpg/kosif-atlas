<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Control Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F2F4F6; --panel: #FFFFFF; --ink: #1B2630; --muted: #5B6B7A; --line: #C9D1D9;
    --human: #D08A1F; --pred: #2E8B5C; --agent: #6D5BD0; --ext: #3A6FA8; --halt: #C2453A;
    --human-bg: #FBF1DF; --pred-bg: #E3F3EA; --agent-bg: #ECE8FA; --ext-bg: #E3ECF6; --halt-bg: #F8E3E1;
    --track: #E9EDF1; --text: #1B2630;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161C; --panel: #171F27; --ink: #E6ECF1; --muted: #98A6B3; --line: #2C3741;
      --human: #E9A43C; --pred: #4DBA83; --agent: #9A8CF0; --ext: #6FA1DC; --halt: #E5675C;
      --human-bg: #2E2414; --pred-bg: #13301F; --agent-bg: #221E3B; --ext-bg: #142639; --halt-bg: #3A1A17;
      --track: #1C252E; --text: #E6ECF1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; }
  .wrap { max-width: 1480px; margin: 0 auto; min-height: 100vh; }
  .sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px 10px; }
  h1 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 30px; text-transform: uppercase; margin: 0; line-height: 1; letter-spacing: 0.01em; }
  .sub { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .ptitle { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .mono { font-family: "IBM Plex Mono", Menlo, monospace; }
  .chip { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10.5px; padding: 2px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
  .k-adv  { color: var(--pred);  border-color: var(--pred);  background: var(--pred-bg); }
  .k-ai   { color: var(--agent); border-color: var(--agent); background: var(--agent-bg); }
  .k-run  { color: var(--ext);   border-color: var(--ext);   background: var(--ext-bg); }
  .k-park { color: var(--human); border-color: var(--human); background: var(--human-bg); }
  .k-fail { color: var(--halt);  border-color: var(--halt);  background: var(--halt-bg); }
  .k-dim  { color: var(--muted); border-color: var(--line);  background: var(--track); }
  button.chip { font: inherit; font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10.5px; cursor: pointer; }
  .stats { display: flex; align-items: center; gap: 22px; padding: 8px 24px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .stat b { font-family: "IBM Plex Mono", Menlo, monospace; font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 5px; }
  .stat { color: var(--muted); white-space: nowrap; }
  .stats .ship { margin-left: auto; color: var(--muted); }
  .cols, .cells { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .cols { padding: 10px 24px 8px; }
  .col-h { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid; padding-bottom: 4px; }
  .col-h .nm { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.06em; }
  .col-h .n { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 11px; color: var(--muted); }
  .lanes { padding: 6px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
  .lane { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .lane-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; user-select: none; }
  .lane-h svg { transition: transform .15s; flex: none; }
  .lane.closed .lane-h svg { transform: rotate(-90deg); }
  .lane-h .nm { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.04em; }
  .lane-h .desc { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-h .prog { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 11px; color: var(--muted); }
  .lane-h .bar { width: 160px; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .lane-h .bar i { display: block; height: 100%; background: var(--pred); }
  .cells { padding: 0 14px 14px; }
  .lane.closed .cells { display: none; }
  .cell { background: var(--bg); border-radius: 5px; padding: 8px; min-height: 64px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 5px; padding: 9px 11px; cursor: pointer; transition: transform .1s, box-shadow .1s; }
  .card:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(27,38,48,.12); }
  .card .t { font-weight: 600; font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
  .card .s { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .card .note { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
  .card.dim { opacity: .7; }
  .rail { display: flex; gap: 3px; margin-top: 7px; }
  .rail i { flex: 1; height: 4px; border-radius: 2px; background: var(--track); }
  .strail { display: flex; gap: 8px; margin-bottom: 14px; }
  .st { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .st .bar { height: 6px; border-radius: 3px; width: 100%; background: var(--track); }
  .st .nm { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .st-done .bar { background: var(--pred); }   .st-done .nm { color: var(--ink); }
  .st-act .bar { background: var(--ext); }     .st-act .nm { color: var(--ext); font-weight: 600; }
  .st-ai .bar { background: var(--agent); }    .st-ai .nm { color: var(--agent); font-weight: 600; }
  .st-park .bar { background: var(--human); }  .st-park .nm { color: var(--human); font-weight: 600; }
  .st-fail .bar { background: var(--halt); }   .st-fail .nm { color: var(--halt); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .st-act .bar, .st-ai .bar, .rail i.live { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  }
  .overlay { position: fixed; inset: 0; background: rgba(27,38,48,.45); z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 6px; width: 760px; max-width: 100%; padding: 18px 22px 22px; }
  .modal .x { float: right; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; background: none; border: none; padding: 2px 6px; }
  .sec { margin-top: 16px; }
  .lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .feed { overflow-y: auto; max-height: 40vh; }
  .feedrow { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
  .feedrow:last-child { border-bottom: none; }
  .evdetail { background: var(--track); border-radius: 4px; padding: 8px 12px; margin: 2px 0 6px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .evdetail b { color: var(--ink); font-weight: 600; }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; }
  @media (max-width: 900px) {
    .sticky { position: static; }
    header { flex-wrap: wrap; gap: 10px; padding: 12px 14px 8px; }
    h1 { font-size: 24px; }
    .stats { flex-wrap: wrap; gap: 8px 16px; padding: 8px 14px; }
    .stats .ship { flex-basis: 100%; margin-left: 0; }
    .cols { display: none; }
    .lanes { padding: 6px 10px 20px; }
    .lane-h { flex-wrap: wrap; }
    .lane-h .desc { display: none; }
    .lane-h .bar { width: 100%; }
    .cells { grid-template-columns: 1fr; padding: 0 10px 10px; }
    .cell::before { content: attr(data-col) " · " attr(data-n); font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
    .cell:empty, .cell.none { display: none; }
    .overlay { padding: 8px; }
    .modal { padding: 14px; }
    .strail { gap: 3px; } .st .nm { font-size: 9px; }
  }
  @media (min-width: 600px) and (max-width: 900px) {
    .cells { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    .lane-h .bar { width: 160px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sticky">
    <header>
      <div>
        <h1>Factory control room</h1>
        <div class="sub">board view &middot; swimlane per release &middot; click a card for details</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="chip k-dim" id="toggleall">collapse all</button>
        <span class="chip k-ai" id="spend" style="display:none"></span>
        <span class="chip k-run" id="lease">&hellip;</span>
        <span class="mono" id="clock" style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums"></span>
      </div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="cols" id="colhead"></div>
  </div>
  <div class="lanes" id="lanes"></div>
</div>
<div id="modal" hidden></div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var selectedRun = null;
  var expanded = {};
  var reviewOpen = {};
  var reviewData = {};
  var codeOpen = {}; // the diff section, folded until asked for
  var fileOpen = {}; // one entry per file within it
  var sending = {};
  var verdictResult = {};

  function sendVerdict(runId, decision) {
    var box = $("why-" + runId);
    var reason = box ? box.value : "";
    // A rejection with no reason leaves the next person nothing to act on, and
    // the factory itself records only "reviewer rejected the verdict".
    if (decision === "reject" && reason.trim() === "") {
      $("err-" + runId).textContent = "Please say what is wrong before rejecting — otherwise nobody knows what to fix.";
      if (box) box.focus();
      return;
    }
    sending[runId] = true;
    render(last);
    fetch("/verdict", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ run: runId, decision: decision, reason: reason }),
    })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: "Could not reach the factory." }; })
      .then(function (res) {
        sending[runId] = false;
        verdictResult[runId] = res;
        render(last);
        poll();
        // The run's state may have moved, so the panel is re-read — but only by
        // REPLACING it on arrival. Clearing it first would drop the panel back to
        // its loading state and hide the very error we just came back with.
        fetch("/review?run=" + encodeURIComponent(runId))
          .then(function (r) { return r.json(); })
          .then(function (d) { reviewData[runId] = d; render(last); })
          .catch(function () { /* keep what is on screen */ });
      });
  }
  var tab = "queue"; // which side-pane tab is showing
  var last = null; // most recent /state, so a review toggle can re-render without waiting for the poll
  function usageText(u) {
    if (!u) return "";
    var parts = [];
    if (typeof u.cost_usd === "number") parts.push("$" + u.cost_usd.toFixed(2));
    if (typeof u.output_tokens === "number") parts.push(Math.round(u.output_tokens / 100) / 10 + "k out");
    if (typeof u.input_tokens === "number") parts.push(Math.round(u.input_tokens / 100) / 10 + "k in");
    return parts.join(" \u00b7 ");
  }
  function esc(v) {
    return String(v == null ? "—" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // The decision card used to name a run and stop, which is no decision aid at
  // all (OI-19). Clicking it pulls the reviewer's retained findings and the
  // actual red^..green diff from the read-only /review endpoint.
  function toggleReview(runId) {
    if (reviewOpen[runId]) { reviewOpen[runId] = false; render(last); return; }
    reviewOpen[runId] = true;
    render(last);
    if (reviewData[runId]) return;
    fetch("/review?run=" + encodeURIComponent(runId))
      .then(function (r) { return r.json(); })
      .then(function (d) { reviewData[runId] = d; render(last); })
      .catch(function () { reviewData[runId] = { error: "could not read the change" }; render(last); });
  }

  function diffHtml(text) {
    return text.split("\n").map(function (line) {
      var c = "var(--text)";
      if (line.charAt(0) === "+" && line.slice(0, 3) !== "+++") c = "#2E8B5C";
      else if (line.charAt(0) === "-" && line.slice(0, 3) !== "---") c = "#C4453C";
      else if (line.charAt(0) === "@") c = "var(--muted)";
      else if (line.slice(0, 4) === "diff") c = "var(--human)";
      return '<div style="color:' + c + '">' + esc(line || " ") + "</div>";
    }).join("");
  }

  // The person signing this is not necessarily an engineer, and the code is the
  // LAST thing they need. Lead with what was asked for, what came back, and what
  // signing actually does; keep every line of code folded away until asked for.
  var LBL = "font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px";
  var BODY = "font-size:12.5px;line-height:1.55;margin-bottom:12px";

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function renderReview(d) {
    var box = 'margin-top:12px;border-top:1px solid var(--line);padding-top:12px';
    if (!d) return '<div style="' + box + ';color:var(--muted);font-size:12px">reading it now…</div>';
    if (d.error) return '<div style="' + box + ';color:var(--muted);font-size:12px">' + esc(d.error) + "</div>";

    var out = '<div style="' + box + '">';

    // 1. What you asked the factory for, in the words of the approved spec.
    if (d.spec && (d.spec.problem || d.spec.outcome)) {
      out += '<div style="' + LBL + '">What you asked for</div><div style="' + BODY + '">' +
        (d.spec.problem ? esc(d.spec.problem) + " " : "") +
        (d.spec.outcome ? '<span style="color:var(--muted)">The goal: ' + esc(d.spec.outcome) + "</span>" : "") + "</div>";
    }

    // 2. What came back, counted rather than described.
    var files = d.files || [];
    var added = files.reduce(function (n, f) { return n + f.added; }, 0);
    var removed = files.reduce(function (n, f) { return n + f.removed; }, 0);
    if (files.length) {
      out += '<div style="' + LBL + '">What the factory built</div><div style="' + BODY + '">It changed ' +
        plural(files.length, "file", "files") + " — writing " + plural(added, "line", "lines") +
        " and deleting " + plural(removed, "line", "lines") + ".</div>";
    }

    // 3. What was checked automatically, so they know what is NOT left to them.
    var c = d.checks || {};
    var checks = [];
    if (c.tests_ran) checks.push("Every test passed.");
    if (typeof c.coverage_lines === "number" && typeof c.coverage_floor === "number") {
      checks.push("Tests cover " + Math.round(c.coverage_lines) + "% of the code — your minimum is " + c.coverage_floor + "%.");
    }
    if (c.quality_passed) checks.push("The code passed the style and safety checks.");
    if (checks.length) {
      out += '<div style="' + LBL + '">Already checked for you</div><div style="' + BODY + '">' +
        checks.map(function (t) {
          return '<div style="display:flex;gap:7px;margin-bottom:3px"><span style="color:#2E8B5C">✓</span><span>' + esc(t) + "</span></div>";
        }).join("") + "</div>";
    }

    // 4. The reviewer's read. Three kinds of absence, each said plainly — never
    // a blank that reads as "nothing wrong".
    var f = d.review && d.review.findings;
    out += '<div style="' + LBL + '">What the reviewer said</div><div style="' + BODY + '">';
    if (!d.review) {
      out += '<span style="color:var(--muted)">Nothing was saved. This run finished before the factory started keeping the reviewer’s notes, so you are reading the change yourself this time.</span>';
    } else if (f === null) {
      out += '<span style="color:var(--muted)">The reviewer answered, but the reply could not be read back. Treat it as no review at all.</span>';
    } else if (f && f.length === 0) {
      out += '<span style="color:#2E8B5C">The reviewer read it and found no problems.</span>';
    } else if (f && f.length) {
      out += "The reviewer raised " + plural(f.length, "concern", "concerns") + ":" +
        f.map(function (x) {
          return '<div style="margin-top:6px"><span class="mono" style="color:var(--human);font-size:11px">' +
            esc(x.severity || "note") + "</span> " + esc(x.path || "") +
            '<div style="color:var(--muted)">' + esc(x.reason || x.message || "") + "</div></div>";
        }).join("");
    }
    out += "</div>";

    // 5. The ask, and the reply itself — a decision you cannot act on is not a
    // decision, it is a notification.
    var sent = verdictResult[d.run_id];
    out += '<div style="' + LBL + '">What we need from you</div><div style="' + BODY + '">' +
      "Decide whether this is the change you wanted." +
      '<div style="margin-top:6px"><b style="color:#2E8B5C">Approve</b> <span style="color:var(--muted)">and the factory finishes the job and moves on.</span></div>' +
      '<div><b style="color:#C4453C">Reject</b> <span style="color:var(--muted)">and the work stops here. Nothing is thrown away.</span></div>' +
      "</div>";

    // An answer already on disk outranks whatever this page remembers: the run is
    // still waiting, so saying so is the only honest state.
    if (!sent && d.signed) {
      out += '<div style="border:1px solid var(--human);border-radius:4px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:8px">' +
        "<b>You already " + esc(d.signed.decision === "approve" ? "approved" : "rejected") + " this</b>" +
        (d.signed.timestamp ? ' <span style="color:var(--muted)">on ' + esc(String(d.signed.timestamp).replace("T", " at ").slice(0, 19)) + "</span>" : "") +
        '<div style="color:var(--muted);margin-top:4px">Your decision is saved, but the factory has not carried it out — it is still waiting. Answering again below will re-submit it.</div></div>';
    }

    if (sent && sent.ok) {
      out += '<div style="border:1px solid #2E8B5C;border-radius:4px;padding:10px 12px;font-size:12.5px;color:#2E8B5C">' +
        "Recorded — you " + esc(sent.decision === "approve" ? "approved" : "rejected") + " this change." +
        (sent.output ? '<div class="mono" style="font-size:10.5px;color:var(--muted);margin-top:5px;white-space:pre-wrap;word-break:break-all">' + esc(sent.output) + "</div>" : "") +
        "</div>";
    } else if (sending[d.run_id]) {
      out += '<div style="font-size:12.5px;color:var(--muted)">Recording your decision…</div>';
    } else {
      out += '<textarea id="why-' + esc(d.run_id) + '" placeholder="Optional: say why, in your own words. Required if you reject." ' +
        'style="width:100%;box-sizing:border-box;min-height:52px;font:inherit;font-size:12px;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);resize:vertical"></textarea>' +
        '<div style="display:flex;gap:7px;margin-top:7px">' +
        '<button class="verdictbtn" data-run="' + esc(d.run_id) + '" data-decision="approve" ' +
        'style="flex:1;font:inherit;font-size:12.5px;font-weight:600;padding:8px;border-radius:4px;cursor:pointer;border:1px solid #2E8B5C;background:#2E8B5C;color:#fff">Approve</button>' +
        '<button class="verdictbtn" data-run="' + esc(d.run_id) + '" data-decision="reject" ' +
        'style="flex:1;font:inherit;font-size:12.5px;font-weight:600;padding:8px;border-radius:4px;cursor:pointer;border:1px solid #C4453C;background:transparent;color:#C4453C">Reject</button>' +
        "</div>" +
        '<div id="err-' + esc(d.run_id) + '" style="font-size:12px;color:#C4453C;margin-top:6px;line-height:1.5">' +
        (sent && sent.error ? esc(sent.error)
          : (sent && !sent.ok ? esc(sent.plain || sent.output || "The factory could not carry out this decision.") : "")) + "</div>";
    }

    // 6. The code, fully folded. Nobody is made to scroll past a diff to reach
    // the decision above.
    if (files.length) {
      out += '<div class="codetoggle" data-run="' + esc(d.run_id) + '" style="cursor:pointer;font-size:12.5px;color:var(--human);padding-top:2px">' +
        (codeOpen[d.run_id] ? "▾ Hide the code" : "▸ Show me the code") +
        ' <span style="color:var(--muted)">(' + plural(files.length, "file", "files") + ", you don’t need to read this)</span></div>";
      if (codeOpen[d.run_id]) {
        out += '<div style="margin-top:8px">' + files.map(function (file, i) {
          var key = d.run_id + "::" + i;
          return '<div style="border:1px solid var(--line);border-radius:4px;margin-bottom:6px;overflow:hidden">' +
            '<div class="filetoggle" data-key="' + esc(key) + '" style="cursor:pointer;padding:7px 9px;display:flex;justify-content:space-between;gap:8px;align-items:baseline">' +
            '<span class="mono" style="font-size:11px;word-break:break-all">' + (fileOpen[key] ? "▾ " : "▸ ") + esc(file.path) + "</span>" +
            '<span class="mono" style="font-size:10.5px;white-space:nowrap"><span style="color:#2E8B5C">+' + file.added + '</span> <span style="color:#C4453C">−' + file.removed + "</span></span></div>" +
            (fileOpen[key]
              ? '<div class="mono" style="font-size:10.5px;line-height:1.5;max-height:320px;overflow:auto;border-top:1px solid var(--line);padding:8px;white-space:pre">' + diffHtml(file.body) + "</div>"

  function dur(a, b) {

  function chipFor(ev) {

    if (k === "stage-started") {
      if (st === "red" || st === "green") return { cls: "k-ai", label: "ai working" };
      return { cls: "k-run", label: "started" };
    }
    if (k === "stage-parked" || k === "run-parked") {

  }
  function pillFor(run) {

  var C = { done: "#2E8B5C", park: "#D08A1F", fail: "#C2453A", todo: "#C9D1D9" };

  // ---- board -------------------------------------------------------------
  var COLS = [

    { id: "decide", name: "Needs your decision", color: "var(--human)", bg: "var(--human-bg)" },
    { id: "done",   name: "Done",               color: "var(--pred)",  bg: "var(--pred-bg)" },

  function cardHtml(c, col) {

      '<div class="t">' + esc(c.title) + "</div>" +
      '<div class="s"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.sub) + '</span><span class="chip ' + c.pill.cls + '">' + esc(c.pill.label) + "</span></div>" +
      (c.rail ? '<div class="rail">' + c.rail + "</div>" : "") +

  function render(s) {
    var lockHeld = !!s.lease;

    leaseEl.className = "chip " + (lockHeld ? "k-run" : "k-adv");
    leaseEl.textContent = lockHeld ? "LOCK HELD · pid " + (s.lease.holder_pid || "?") + " · " + String(s.lease.run_id).slice(0, 8) : "LOCK FREE";

    var cards = buildCards(s);
    var count = function (col) { return cards.filter(function (c) { return c.col === col; }).length; };
    var live = null;
    s.runs.forEach(function (r) { if (lockHeld && r.run_id === s.lease.run_id) live = r; });
    $("clock").textContent = live ? "elapsed " + dur(live.first_ts, s.now) : "";

    var spent = 0, outTok = 0;
    (s.active_events || []).forEach(function (ev) {
      if (ev.usage && typeof ev.usage.cost_usd === "number") spent += ev.usage.cost_usd;

          '<span class="nm">' + esc(name) + "</span>" + chip +
          '<span class="desc">' + mine.length + " items · " + esc(mine.map(function (c) { return c.col; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(", ")) + "</span>" +

    m.querySelector(".overlay").onclick = function (e) { if (e.target === e.currentTarget) closeModal(); };
    Array.prototype.forEach.call(m.querySelectorAll(".codetoggle"), function (el) {
      el.onclick = function () { var k = el.getAttribute("data-run"); codeOpen[k] = !codeOpen[k]; render(last); };
    });
    Array.prototype.forEach.call(m.querySelectorAll(".filetoggle"), function (el) {
      el.onclick = function () { var k = el.getAttribute("data-key"); fileOpen[k] = !fileOpen[k]; render(last); };
    });
    Array.prototype.forEach.call(m.querySelectorAll(".verdictbtn"), function (el) {
      el.onclick = function () { sendVerdict(el.getAttribute("data-run"), el.getAttribute("data-decision")); };
    });
    Array.prototype.forEach.call(m.querySelectorAll(".feedrow"), function (el) {
      el.onclick = function () { var seq = el.getAttribute("data-seq"); expanded[seq] = expanded[seq] !== true; render(last); };
    });
  }
  function openModal(kind, id) {
    openCard = { kind: kind, id: id };
    expanded = {};
    if (kind === "run") {
      selectedRun = id; // /state?run= supplies this run's events on the next poll
      if (!reviewData[id]) {
        fetch("/review?run=" + encodeURIComponent(id)).then(function (r) { return r.json(); })
          .then(function (d) { reviewData[id] = d; if (last) render(last); })
          .catch(function () { reviewData[id] = { error: "could not read the change" }; if (last) render(last); });
      }
    }
    if (last) render(last);
    poll();
  }
  function closeModal() { openCard = null; selectedRun = null; if (last) render(last); poll(); }

  $("lanes").addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (card) { openModal(card.getAttribute("data-kind"), card.getAttribute("data-id")); return; }
    var h = e.target.closest(".lane-h");
    if (h) { var n = h.parentNode.getAttribute("data-lane"); closed[n] = !closed[n]; if (last) render(last); }
  });
  $("toggleall").addEventListener("click", function () {
    if (!last) return;
    var lanes = laneOrder(buildCards(last), last);
    var anyOpen = lanes.some(function (l) { return !closed[l]; });
    lanes.forEach(function (l) { closed[l] = anyOpen; });
    render(last);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openCard) closeModal(); });

  function poll() {
    fetch("/state" + (selectedRun ? "?run=" + encodeURIComponent(selectedRun) : "")).then(function (r) { return r.json(); }).then(function (s) {
      last = s;
      render(s);
    }).catch(function () {
      $("lease").className = "chip k-fail";
      $("lease").textContent = "MONITOR OFFLINE";
    });
  }
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
