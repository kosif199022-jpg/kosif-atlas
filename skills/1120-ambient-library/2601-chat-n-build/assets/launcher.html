<!doctype html>
<!-- chat-n-build launcher. Lists this project's dashboards; creating one is done by asking the agent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e3e1dc; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1e; --ink:#ececec; --mute:#9a9a9a; --line:#2e2e2e; --accent:#fb923c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:auto; padding:20px 16px; }
  h1 { margin:0 0 16px; font-size:22px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  a { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; color:inherit; text-decoration:none; overflow-wrap:anywhere; }
  a:hover, a:focus-visible { border-color:var(--accent); }
  small { display:block; color:var(--mute); font-size:13px; }
  p { color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Dashboards</h1>
  <ul id="list"></ul>
  <p id="empty" hidden>No dashboards yet. Ask the agent to make one.</p>
</main>
<script>
// Names and titles go in via textContent only: titles are agent-written and may carry markup.
async function load() {
  let list = [];
  try { list = await (await fetch('dashboards.json', { cache: 'no-store' })).json(); } catch (e) { return; }
  const ul = document.getElementById('list');
  ul.replaceChildren(...list.map(d => {
    const li = document.createElement('li'), a = document.createElement('a'), small = document.createElement('small');
    a.href = 'd/' + encodeURIComponent(d.name) + '/';
    a.textContent = d.title || d.name;
    small.textContent = d.name;
    a.append(small); li.append(a);
    return li;
  }));
  document.getElementById('empty').hidden = list.length > 0;
}
load();
setInterval(load, 5000);  // ponytail: poll; a new dashboard shows within 5 s
</script>
</body>
</html>
